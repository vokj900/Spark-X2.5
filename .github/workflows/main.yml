name: Build Spark-X2.5 Server for RTX 5060 Ti (Windows)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release 版本号（如 v1.0.0）'
        required: true
        default: 'v1.0.0'
        type: string
      cuda_version:
        description: 'CUDA 版本（如 12.8.1）'
        required: false
        default: '12.8.1'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: windows-2022
    permissions:
      actions: write
      contents: write

    steps:
      - name: Install CUDA Toolkit ${{ inputs.cuda_version }}
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ inputs.cuda_version }}
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev"]'

      - name: Checkout XHToken/llama.cpp (master)
        uses: actions/checkout@v4
        with:
          repository: XHToken/llama.cpp
          ref: master
          submodules: recursive
          path: src

      - name: Build llama-server (Windows + CUDA + sm_120)
        shell: cmd
        run: |
          echo ================================================================
          echo [1/6] 加载 MSVC x64 环境
          echo ================================================================
          for /f "delims=" %%i in ('"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath') do set "VS_PATH=%%i"
          set "VCVARS=%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"
          if not exist "%VCVARS%" (echo ❌ 未找到 %VCVARS% && exit /b 1)
          call "%VCVARS%"
          if %ERRORLEVEL% neq 0 (echo ❌ MSVC 环境加载失败 && exit /b 1)
          where cl.exe || (echo ❌ cl.exe 未加载 && exit /b 1)
          for /f "delims=" %%i in ('where cl.exe') do set "CL_PATH=%%i"
          echo ✅ MSVC cl.exe: %CL_PATH%

          echo ================================================================
          echo [2/6] 从 PATH 中剔除预装 MinGW
          echo ================================================================
          set "PATH=%PATH:C:\mingw64\bin;=%"
          set "PATH=%PATH:;C:\mingw64\bin=%"
          set "PATH=%PATH:C:\mingw64\bin=%"
          set "PATH=%PATH:C:\msys64\mingw64\bin;=%"
          set "PATH=%PATH:;C:\msys64\mingw64\bin=%"
          set "PATH=%PATH:C:\msys64\mingw64\bin=%"
          set "PATH=%PATH:C:\msys64\ucrt64\bin;=%"
          set "PATH=%PATH:;C:\msys64\ucrt64\bin=%"
          set "PATH=%PATH:C:\msys64\ucrt64\bin=%"
          where cc.exe && (
            for %%i in (cc.exe gcc.exe g++.exe) do (
              for /f "delims=" %%j in ('where %%i 2^>nul') do del /f /q "%%j" || echo 删除 %%j  failed
            )
          ) || echo ✅ cc.exe 已在 PATH 中消失
          where cc.exe && (echo ❌ cc.exe 仍存在 && exit /b 1) || echo ✅ MinGW 屏蔽成功

          echo ================================================================
          echo [3/6] 安装依赖 + 验证 CUDA
          echo ================================================================
          echo CUDA_PATH: %CUDA_PATH%
          set "CUDA_BIN=%CUDA_PATH%\bin"
          if not exist "%CUDA_BIN%\nvcc.exe" (
            echo ❌ %CUDA_BIN%\nvcc.exe 不存在！
            dir "%CUDA_BIN%"
            exit /b 1
          )
          echo ✅ CUDA bin 目录：%CUDA_BIN%
          set "PATH=%CUDA_BIN%;%PATH%"

          choco install openssl ninja -y --no-progress
          where ninja || (echo ❌ ninja 未安装 && exit /b 1)
          where nvcc || (echo ❌ nvcc 仍未找到 && exit /b 1)
          nvcc --version
          echo ✅ 依赖就绪

          echo ================================================================
          echo [4/6] CMake 配置（★ 显式开启 LLAMA_BUILD_SERVER）
          echo ================================================================
          cd src
          if exist build rmdir /s /q build
          mkdir build
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DCMAKE_C_COMPILER="%CL_PATH%" ^
            -DCMAKE_CXX_COMPILER="%CL_PATH%" ^
            -DCMAKE_CUDA_COMPILER="%CUDA_BIN%\nvcc.exe" ^
            -DCMAKE_C_COMPILER_WORKS=ON ^
            -DCMAKE_CXX_COMPILER_WORKS=ON ^
            -DGGML_CUDA=ON ^
            -DCMAKE_CUDA_ARCHITECTURES="120" ^
            -DGGML_NATIVE=OFF ^
            -DLLAMA_BUILD_SERVER=ON ^
            -DLLAMA_BUILD_TOOLS=ON ^
            -DLLAMA_BUILD_BORINGSSL=OFF ^
            -DOPENSSL_USE_STATIC_LIBS=ON ^
            -DOPENSSL_ROOT_DIR="C:\Program Files\OpenSSL" ^
            -DCMAKE_C_FLAGS="/MT" ^
            -DCMAKE_CXX_FLAGS="/MT" ^
            -DCMAKE_VERBOSE_MAKEFILE=ON
          if %ERRORLEVEL% neq 0 (echo ❌ CMake 配置失败 && exit /b 1)
          echo ✅ CMake 配置完成

          echo ================================================================
          echo [5/6] 编译 llama-server（★ 现在 target 一定会生成）
          echo ================================================================
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS% -t llama-server
          if %ERRORLEVEL% neq 0 (echo ❌ 编译失败 && exit /b 1)
          if not exist "build\bin\Release\llama-server.exe" (
            echo ❌ 未找到 build\bin\Release\llama-server.exe
            dir /s build\llama-server.exe 2>nul || echo 全盘未找到
            exit /b 1
          )
          echo 🎉🎉🎉 编译成功！

          echo ================================================================
          echo [6/6] 收集产物到 out 目录
          echo ================================================================
          mkdir out
          copy build\bin\Release\llama-server.exe out\
          copy build\bin\Release\*.dll out\
          copy "%CUDA_PATH%\bin\cudart64_*.dll" out\
          copy "%CUDA_PATH%\bin\cublas64_*.dll" out\
          copy "%CUDA_PATH%\bin\cublasLt64_*.dll" out\
          copy "C:\Windows\System32\vcruntime140.dll" out\
          copy "C:\Windows\System32\vcruntime140_1.dll" out\
          copy "C:\Windows\System32\msvcp140.dll" out\
          copy "C:\Windows\System32\msvcp140_1.dll" out\
          copy "C:\Windows\System32\msvcp140_2.dll" out\
          copy "C:\Windows\System32\concrt140.dll" out\
          echo === 产物列表 ===
          dir out\

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spark-x25-server
          path: src/out/
          retention-days: 7

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: spark-x25-server
          path: release-files

      - name: Package release zip
        shell: pwsh
        run: |
          echo "=== 准备打包的文件 ==="
          Get-ChildItem -Path "release-files" -Recurse | Format-Table FullName, Length
          $zipName = "spark-x25-llama-server-cuda${{ inputs.cuda_version }}-rtx5060ti-${{ inputs.tag_name }}.zip"
          Compress-Archive -Path "release-files\*" -DestinationPath $zipName -Force
          echo "=== 最终 zip 文件 ==="
          Get-Item $zipName | Format-List Name, Length
          echo "ZIP_PATH=$zipName" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: Spark-X2.5 Server ${{ inputs.tag_name }} — Windows RTX 5060 Ti
          body: |
            ## ✨ Spark-X2.5 Windows 版（RTX 5060 Ti / Blackwell sm_120）
            基于 [XHToken/llama.cpp](https://github.com/XHToken/llama.cpp) `master` 分支编译，支持 `spark2_5` 架构。

            ### 🚀 快速使用
            1. 下载解压到纯英文目录，放入 `Spark-X2.5-4B.gguf`
            2. PowerShell 运行：
